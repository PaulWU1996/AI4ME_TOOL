# Mock stack: the real controller/worker/redis wiring, with the four GPU
# analysis services replaced by a stdlib HTTP mock (mocks/service.py).
#
# Every service uses `image:` and no `build:` — deliberate. The worker starts
# on-demand services by shelling out to `docker compose -f <this file>` from
# *inside* its own container, where the repo's build contexts do not exist.
# Image-only means that inner invocation never needs them.
#
# Build the images first, then bring it up (scripts/mock_e2e.sh does both):
#   docker compose -f tests/e2e/docker-compose.mock.yml --project-directory . \
#     -p ai4me_mock up -d redis controller worker
#
# Relative volume paths resolve against --project-directory (the repo root),
# which is also what the worker passes via COMPOSE_PROJECT_DIR, so host and
# in-container invocations agree on what "./shared" means.

x-mock-service: &mock-service
  image: ai4me-mock-service:latest
  profiles: [ "on-demand" ]
  restart: "no"
  networks: [ ai_network ]
  volumes:
    - ./shared:/app/tmp
  healthcheck:
    test: [ "CMD", "curl", "-fs", "http://localhost:8000/health" ]
    interval: 2s
    timeout: 2s
    retries: 10
    start_period: 2s

services:

  redis:
    image: redis/redis-stack-server:latest
    container_name: mock-redis
    ports: [ "16379:6379" ]
    networks: [ ai_network ]
    restart: unless-stopped

  controller:
    image: ai4me-mock-controller:latest
    container_name: mock-controller
    ports: [ "19000:9000" ]
    volumes:
      - ./shared:/app/tmp
      - ./data:/app/data
      - ./tests/e2e/workflows:/app/workflows
    environment:
      - SHARED_PATH=/app/tmp
      - WORKFLOWS_PATH=/app/workflows
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on: [ redis ]
    networks: [ ai_network ]
    restart: unless-stopped

  worker:
    image: ai4me-mock-worker:latest
    container_name: mock-worker
    volumes:
      - ./shared:/app/tmp
      - ./data:/app/data
      - ./tests/e2e/workflows:/app/workflows
      - /var/run/docker.sock:/var/run/docker.sock
      - ./tests/e2e/docker-compose.mock.yml:/app/docker-compose.mock.yml:ro
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AUDIO_HOST=audioservice
      - AUDIO_PORT=8000
      - VISUAL_HOST=visualservice
      - VISUAL_PORT=8000
      - SUMMARISE_HOST=transcriptservice
      - SUMMARISE_PORT=8000
      - TAGGING_HOST=taggingservice
      - TAGGING_PORT=8000
      - SHARED_PATH=/app/tmp
      - WORKFLOWS_PATH=/app/workflows
      - API_KEY_PATH=/app/data
      - ADMIN_KEY=mock_admin_password
      # The worker shells out to compose to start on-demand services. These
      # three must describe the *host's* view of the project, since the
      # docker daemon it talks to is the host's.
      - COMPOSE_FILE=/app/docker-compose.mock.yml
      - COMPOSE_PROJECT_DIR=${PWD}
      - COMPOSE_PROJECT_NAME=ai4me_mock
      - SERVICE_MODES_PATH=/app/tmp/service_modes.json
      # Mocks are healthy in ~2s, not ~5min. Without this every cold start
      # would cost a full 60s poll interval.
      - HEALTH_CHECK_TIMEOUT=60
      - HEALTH_CHECK_INTERVAL=2
    command: celery -A tasks worker --loglevel=info --concurrency=1
    depends_on: [ redis ]
    networks: [ ai_network ]
    restart: unless-stopped

  # Always-on, unlike the four analysis mocks: it receives finalize_results'
  # callback POSTs, which arrive after the on-demand services have been
  # stopped again, so it cannot itself be on-demand.
  callbacksink:
    image: ai4me-mock-service:latest
    container_name: mock-callbacksink
    ports: [ "19005:8000" ]
    environment:
      - MOCK_ROLE=sink
    networks: [ ai_network ]
    restart: unless-stopped

  visualservice:
    <<: *mock-service
    container_name: visualservice
    ports: [ "19001:8000" ]
    volumes:
      - ./shared:/app/tmp
      - ./shared/api-data:/app/data
    environment:
      - MOCK_ROLE=visual
      - MOCK_STARTUP_DELAY=${MOCK_VISUAL_STARTUP_DELAY:-0}
      - MOCK_LATENCY=${MOCK_VISUAL_LATENCY:-0}
      - MOCK_FAIL_MODE=${MOCK_VISUAL_FAIL_MODE:-}
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8000/health/" ]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  audioservice:
    <<: *mock-service
    container_name: audioservice
    ports: [ "19002:8000" ]
    environment:
      - MOCK_ROLE=audio
      - MOCK_STARTUP_DELAY=${MOCK_AUDIO_STARTUP_DELAY:-0}
      - MOCK_LATENCY=${MOCK_AUDIO_LATENCY:-0}
      - MOCK_FAIL_MODE=${MOCK_AUDIO_FAIL_MODE:-}
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:8000/health/" ]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  transcriptservice:
    <<: *mock-service
    container_name: transcriptservice
    ports: [ "19003:8000" ]
    environment:
      - MOCK_ROLE=transcript
      - MOCK_STARTUP_DELAY=${MOCK_TRANSCRIPT_STARTUP_DELAY:-0}
      - MOCK_LATENCY=${MOCK_TRANSCRIPT_LATENCY:-0}
      - MOCK_FAIL_MODE=${MOCK_TRANSCRIPT_FAIL_MODE:-}

  taggingservice:
    <<: *mock-service
    container_name: taggingservice
    ports: [ "19004:8000" ]
    environment:
      - MOCK_ROLE=tagging
      - MOCK_STARTUP_DELAY=${MOCK_TAGGING_STARTUP_DELAY:-0}
      - MOCK_LATENCY=${MOCK_TAGGING_LATENCY:-0}
      - MOCK_FAIL_MODE=${MOCK_TAGGING_FAIL_MODE:-}

networks:
  ai_network:
    driver: bridge
