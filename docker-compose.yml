services:

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=60
      - CURL_TIMEOUT=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - ai_network

  redis:
    image: redis/redis-stack-server:latest
    container_name: redis
    ports:
      - "6379:6379" # communication port
      - "8001:8001" # Redis Insight GUI
    networks:
      - ai_network
    restart: unless-stopped
    labels:
      - "autoheal=true"

  controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
    # image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:controller
    container_name: controller
    ports:
      - "9000:9000"
    volumes:
      - ./shared:/app/tmp
      - ./data:/app/data
      - ./workflows:/app/workflows
    environment:
      - SHARED_PATH=/app/tmp
      - WORKFLOWS_PATH=/app/workflows
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - ai_network
      - shared_network
    restart: unless-stopped
    labels:
      - "autoheal=true"

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    # image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPO}:worker
    container_name: worker
    volumes:
      - ./shared:/app/tmp
      - ./data:/app/data
      - ./workflows:/app/workflows
      # Docker socket — allows worker to start/stop service containers
      # Linux (default):        /var/run/docker.sock:/var/run/docker.sock
      # macOS Colima:           ~/.colima/default/docker.sock:/var/run/docker.sock
      # Windows Docker Desktop: //./pipe/docker_engine://./pipe/docker_engine
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker-compose.yml:/app/docker-compose.yml:ro
    environment:
      # - AWS_ACCOUNT_ID=${AWS_ACCOUNT_ID}
      # - AWS_REGION=${AWS_REGION}
      - ECR_REPO=${ECR_REPO}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - AUDIO_HOST=audioservice
      - AUDIO_PORT=8000
      - VISUAL_HOST=visualservice
      - VISUAL_PORT=8000
      - SUMMARISE_HOST=transcriptservice
      - SUMMARISE_PORT=8000
      - TAGGING_HOST=taggingservice
      - TAGGING_PORT=8000
      - SHARED_PATH=/app/tmp
      - WORKFLOWS_PATH=/app/workflows
      - ADMIN_KEY=${AI4ME_ADMIN_PASSWORD}
      # Forwarded (not just baked into ADMIN_KEY above) so the nested `docker compose`
      # this container shells out to (see worker/utils.py:_compose) can re-interpolate
      # visualservice's own ADMIN_KEY=${AI4ME_ADMIN_PASSWORD} from its inherited env —
      # it has no access to the host .env file when starting sibling services.
      - AI4ME_ADMIN_PASSWORD=${AI4ME_ADMIN_PASSWORD}
      - COMPOSE_PROJECT_DIR=${PWD}
      - COMPOSE_FILE=/app/docker-compose.yml
      - SERVICE_MODES_PATH=/app/tmp/service_modes.json
    command: celery -A tasks worker --loglevel=info --concurrency=1
    depends_on:
      - redis
    networks:
      - ai_network
      - shared_network
    restart: unless-stopped
    labels:
      - "autoheal=true"

  audioservice:
    profiles: [ "on-demand" ]
    image: audioservice:latest
    container_name: audioservice
    ports:
      - "9002:8000"
    volumes:
      - ./shared:/app/tmp
      - ./weights:/app/weights
    environment:
      - SHARED_PATH=/app/tmp
      - MODEL_PATH=/app/weights/PALUniEncRdFc3Llama31_8B_s2/checkpoint-final
    command: python3 -m uvicorn src.audio_entry:app --host 0.0.0.0 --port 8000
    deploy:
      resources:
        reservations:
          devices:
            # Pinned to a single GPU (0, an A5000) deliberately: excludes GPU 2
            # (a 4GB T400 on this host, which OOMs instantly under device_map="auto"
            # balancing) and GPU 1, since splitting this model's ~18GB of weights
            # across two devices hits a real bug in its custom code -- a torch.cat
            # mixing tensors still on cuda:0 and cuda:1 without moving them first.
            # The weights fit in one A5000's 24GB with room for activations.
            - driver: nvidia
              device_ids: [ "0" ]
              capabilities: [ gpu ]
    networks:
      - ai_network
    restart: no
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health/" ]
      interval: 1m
      timeout: 30s
      retries: 3
      start_period: 5m

  visualservice:
    profiles: [ "on-demand" ]
    image: visualservice:latest
    container_name: visualservice
    deploy:
      resources:
        reservations:
          devices:
            # Pinned to GPU 1, deliberately separate from audioservice's GPU 0:
            # this model defaults to plain "cuda" (device 0 as the container sees
            # it), so with count:all it silently landed on the same physical GPU
            # as audioservice's ~18GB resident model, leaving too little headroom
            # for its own inference once both are warm at once (keepalive mode,
            # or any overlap in the DAG path) -- causing a silent per-batch
            # failure masked as "Error processing frames" text, not a crash.
            - driver: nvidia
              device_ids: [ "1" ]
              capabilities: [ gpu ]
    environment:
      - ADMIN_KEY=${AI4ME_ADMIN_PASSWORD}
      - API_KEY_PATH=/app/data
    volumes:
      - ./weights/models:/app/models
      - ./shared/api-data:/app/data
    ports:
      - "9001:8000"
    networks:
      - ai_network
    restart: no
    healthcheck:
      # narrative-api's image has no curl/wget; python3 is the only HTTP-capable binary present.
      test: [ "CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/', timeout=5).status == 200 else 1)" ]
      interval: 1m
      timeout: 30s
      retries: 3
      start_period: 5m

  transcriptservice:
    profiles: [ "on-demand", "llm" ]
    # image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/ai4me/summarise:summarise
    container_name: transcriptservice
    ports:
      - "9003:8000"
    volumes:
      - ./weights/ollama:/root/.ollama/models
      - ./shared:/shared
    environment:
      - OLLAMA_MODEL=llama3.2:3b
      - SHARED_VOLUME_PATH=/shared
      - UVICORN_WORKERS=1
      - UVICORN_LOG_LEVEL=info
      - MAX_TRANSCRIPT_CHARS=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: no
    networks:
      - ai_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

  taggingservice:
    profiles: [ "on-demand", "llm" ]
    # image: ${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/ai4me/tagger:tagger
    container_name: taggingservice
    ports:
      - "9004:8000"
    volumes:
      - ./weights/ollama:/root/.ollama/models
      - ./shared:/shared
    environment:
      - OLLAMA_MODEL=llama3.2:3b
      - SHARED_VOLUME_PATH=/shared
      - UVICORN_WORKERS=1
      - UVICORN_LOG_LEVEL=info
      - MAX_TRANSCRIPT_CHARS=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: no
    networks:
      - ai_network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
      
networks:
  ai_network:
    driver: bridge 
  shared_network:
    external: true
    name: moments_gateway
